name: test

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push cancels the run before it on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  # Kroog end to end without a Claude login: link, the hook commands as Claude Code runs them
  # (Git Bash and PowerShell on Windows, sh elsewhere), the mod through Claude Code, stop.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            relay: ''
          - os: ubuntu-latest
            relay: node
          - os: macos-latest
            relay: ''
          - os: windows-latest
            relay: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: node scripts/smoke.mjs
        env:
          KROOG_RELAY: ${{ matrix.relay }}

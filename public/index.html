<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kroog</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/IBMPlexMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/IBMPlexMono-Medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/brain.css">
<script src="/theme.js"></script>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <a class="brand" href="#/lineage" aria-label="kroog, go to the lineage"><b>kroog</b><span>draft</span></a>
    <nav class="nav" aria-label="Main">
      <a href="#/lineage" data-route="lineage">lineage</a>
      <a href="#/list" data-route="list">list</a>
      <a href="#/brain" data-route="brain">brain</a>
      <a href="#/library" data-route="library">library</a>
      <a href="#/setup" data-route="setup">setup</a>
    </nav>
    <div class="status">
      <button type="button" class="needs-pill" id="needs-pill" hidden><i></i><span id="needs-count"></span><span class="label"> need you</span></button>
      <button type="button" class="icon-btn theme" id="theme-btn" aria-label="Switch between light and dark">
        <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
        <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
      <span class="conn" id="conn"><i></i><span>connecting</span></span>
    </div>
  </header>
  <div class="main" id="main">
    <main class="view" id="view" tabindex="-1"></main>
    <aside class="side" id="side" hidden aria-label="Details"></aside>
  </div>
  <footer class="logbar" id="logbar"></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/water.js" defer></script>
<script type="module" src="/app.js"></script>
</body>
</html>
